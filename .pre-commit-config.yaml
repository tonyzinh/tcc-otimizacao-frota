# Verificações leves e locais. Não tocam em artefatos científicos congelados (listados em `exclude`).
# Instalação: `pip install pre-commit && pre-commit install`. Configuração não testada nesta sessão.
exclude: ^(reports/(tcc_final|tcc_v2)|resultados|tabelas|tcc-artigo-latex)/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=5000]
